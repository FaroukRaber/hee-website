<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALIL ENGINEERING ENVIRONNEMENT (HEE) - Béton & Génie Civil</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        heeDark: '#10243A',
                        heeBlue: '#174B73',
                        heeOrange: '#F28C28',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        body[dir="rtl"] { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Top Bar & Navigation -->
    <header class="bg-heeDark text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="bg-heeOrange text-white font-bold p-2 rounded-lg text-xl">HEE</div>
                    <div>
                        <span class="font-bold text-lg tracking-wider block">HALIL ENGINEERING</span>
                        <span class="text-xs text-heeOrange tracking-widest block">ENVIRONNEMENT</span>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="hidden md:flex space-x-6 items-center rtl:space-x-reverse">
                    <a href="#about" class="nav-about hover:text-heeOrange transition">À propos</a>
                    <a href="#services" class="nav-services hover:text-heeOrange transition">Services</a>
                    <a href="#products" class="nav-products hover:text-heeOrange transition">Produits</a>
                    <a href="#projects" class="nav-projects hover:text-heeOrange transition">Projets</a>
                    <a href="#installations" class="nav-installations hover:text-heeOrange transition">Installations</a>
                    <a href="#contact" class="nav-contact hover:text-heeOrange transition">Contact</a>
                </nav>

                <!-- Language Selector -->
                <div class="flex items-center space-x-2 rtl:space-x-reverse">
                    <button onclick="setLanguage('fr')" class="px-2 py-1 text-sm bg-heeBlue rounded hover:bg-heeOrange transition">FR</button>
                    <button onclick="setLanguage('ar')" class="px-2 py-1 text-sm bg-heeBlue rounded hover:bg-heeOrange transition">AR</button>
                    <button onclick="setLanguage('en')" class="px-2 py-1 text-sm bg-heeBlue rounded hover:bg-heeOrange transition">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative bg-heeDark text-white py-24 overflow-hidden">
        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#174B73_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
            <h1 class="hero-title text-4xl md:text-6xl font-extrabold mb-6">L'Excellence dans le Béton et le Génie Civil</h1>
            <p class="hero-desc text-xl md:text-2xl text-gray-300 max-w-3xl mx-auto mb-10">Solutions innovantes et durables pour la construction et l'aménagement en Algérie.</p>
            <div class="flex justify-center space-x-4 rtl:space-x-reverse">
                <a href="#contact" class="hero-btn-contact bg-heeOrange hover:bg-orange-600 text-white font-bold px-8 py-3 rounded-lg shadow-lg transition">Contactez-nous</a>
                <a href="#services" class="hero-btn-services bg-heeBlue hover:bg-blue-800 text-white font-bold px-8 py-3 rounded-lg shadow-lg transition">Nos Services</a>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="py-20 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="about-heading text-3xl md:text-4xl font-bold text-heeDark mb-4">À Propos de HEE</h2>
                <div class="w-24 h-1 bg-heeOrange mx-auto"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                <div>
                    <h3 class="about-sub text-2xl font-semibold text
